<body class="min-h-screen text-slate-100 antialiased">

<div x-data="dashboard()" x-init="init()" class="max-w-6xl mx-auto px-4 pb-16 pt-5 sm:px-6">

  <!-- ============ HEADER ============ -->
  <header class="flex items-center justify-between gap-3 mb-6">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center text-white font-black text-lg shrink-0 glow-green">UB</div>
      <div class="min-w-0">
        <h1 class="font-bold text-base sm:text-lg leading-tight truncate">Ustaz Basri <span class="text-slate-500 font-medium">· Threads Command Centre</span></h1>
        <p class="text-[11px] sm:text-xs text-slate-400 truncate">Sunnah Neuroparenting · B2C · data hidup dari Zernio</p>
      </div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span class="hidden sm:inline-flex items-center gap-1.5 text-[11px] font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/25 rounded-full px-3 py-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>LIVE
      </span>
      <button @click="load()" class="text-[11px] text-slate-400 hover:text-white bg-slate-800/70 border border-slate-700 rounded-full px-3 py-1.5 transition" :disabled="loading">
        <span x-show="!loading">⟳ Refresh</span><span x-show="loading" class="inline-block animate-spin">⟳</span>
      </button>
    </div>
  </header>

  <!-- loading / error -->
  <div x-show="loading && !data.meta.generatedAt" class="card p-10 text-center text-slate-400 text-sm">
    <div class="inline-block w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin mb-3"></div>
    <p>Mengambil data terkini…</p>
  </div>
  <div x-show="error" class="card p-6 text-center text-rose-400 text-sm border-rose-500/30 mb-5" x-cloak>
    ⚠️ <span x-text="error"></span>
  </div>

  <template x-if="data.meta.generatedAt">
    <div class="space-y-5">

    <!-- ============ HERO / TARGET 3M ============ -->
    <section class="card glow-green p-5 sm:p-6 fade-in">
      <div class="flex flex-wrap items-center gap-4">
        <img :src="data.meta.account.profilePicture" class="w-14 h-14 rounded-full border-2 border-emerald-500/40 object-cover" alt="">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <h2 class="font-bold text-lg" x-text="'@' + data.meta.account.username"></h2>
            <span class="text-[10px] uppercase tracking-wider bg-sky-500/15 text-sky-300 border border-sky-500/25 rounded px-1.5 py-0.5 font-semibold">Threads</span>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">
            <span class="font-semibold text-emerald-400 num" x-text="fmtNum(data.meta.account.followers)"></span> followers ·
            dikemas kini <span x-text="data.meta.generatedAt"></span>
          </p>
        </div>
        <div class="text-right">
          <p class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Target Ogos–Sept</p>
          <p class="font-black text-2xl sm:text-3xl bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent num" x-text="fmtNum(targetViews)"></p>
          <p class="text-[11px] text-slate-400">views 🎯</p>
        </div>
      </div>

      <!-- progress -->
      <div class="mt-5">
        <div class="flex justify-between text-[11px] text-slate-400 mb-1.5">
          <span x-show="!targetReached">Progress ke 3M views 🎯</span>
          <span x-show="targetReached" class="text-emerald-400 font-bold">🎉 TARGET 3M TERCAPAI!</span>
          <span class="font-bold num" :class="targetReached ? 'text-emerald-400' : 'text-emerald-400'" x-text="progressPct + '%'"></span>
        </div>
        <div class="h-3.5 rounded-full bg-slate-800/80 overflow-hidden relative">
          <div class="h-full rounded-full transition-all duration-1000"
               :class="targetReached ? 'bg-gradient-to-r from-amber-400 via-emerald-400 to-emerald-300' : 'bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-400'"
               :style="'width:' + Math.min(progressPct,100) + '%'"></div>
          <div class="absolute inset-0 flex items-center justify-center text-[10px] font-bold text-white/90 drop-shadow num"
               x-text="fmtNum(totalViews) + ' / ' + fmtNum(targetViews)"></div>
        </div>
        <p class="mt-1.5 text-[11px] text-slate-500" x-show="!targetReached">
          Tinggal <b class="text-amber-400 num" x-text="fmtNum(remaining)"></b> views lagi · pada momentum semasa <span class="text-emerald-400" x-text="paceNote"></span>
        </p>
        <p class="mt-1.5 text-[11px] text-emerald-400/90 font-medium" x-show="targetReached">
          Alhamdulillah — sasaran 3M views tercapai! 🎉 Momentum masih berjalan — masa untuk target baru.
        </p>
        <p class="mt-2 text-[10px] text-slate-500/80 leading-relaxed border-t border-slate-800 pt-2">
          ℹ️ <b class="text-slate-300">Views official</b> = jumlah lifetime semua post, ditarik terus dari Meta API (auto) · <b class="text-slate-300">Zernio</b> = track detail per-post, sync ~90 min. Viewers unik masih dari app Threads.
        </p>
      </div>
    </section>

    <!-- ============ KPI GRID ============ -->
    <section class="grid grid-cols-3 sm:grid-cols-6 gap-3 mb-5">
      <div class="card p-4 text-center">
        <p class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Views <span class="text-emerald-500">· app Threads</span></p>
        <p class="text-xl sm:text-2xl font-black text-emerald-400 num mt-1" x-text="fmtNum(totalViews)"></p>
        <p class="text-[10px] text-slate-500 mt-0.5 num truncate" x-text="viewsSubLabel"></p>
      </div>
      <div class="card p-4 text-center">
        <p class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Viewers unik</p>

      <div class="card p-4 text-center">

        <p class="text-xl sm:text-2xl font-black text-rose-400 num mt-1" x-text="fmtNum(totalComments)"></p>
        <p class="text-[10px] text-slate-500 mt-0.5">perbualan</p>
      </div>
      <div class="card p-4 text-center">
        <p class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Share</p>
        <p class="text-xl sm:text-2xl font-black text-amber-400 num mt-1" x-text="fmtNum(totalShares)"></p>
        <p class="text-[10px] text-slate-500 mt-0.5">sebarkan</p>
      </div>
    </section>

    <!-- ============ CHARTS ============ -->
    <section class="grid lg:grid-cols-2 gap-4 mb-5">
      <!-- daily views bar chart -->
      <div class="card p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-sm">Views Harian <span class="text-slate-500 font-normal">(14 hari)</span></h3>

      <!-- POSTS TAB -->
      <div x-show="tab==='posts'" class="space-y-3">
        <template x-for="(p,i) in filteredPosts" :key="p.id">
          <article class="card p-4 sm:p-5 fade-in" :style="'animation-delay:' + Math.min(i*40,300) + 'ms'">
            <div class="flex items-start gap-3">
              <div class="text-center shrink-0 w-9">
                <p class="text-lg font-black num" x-text="i+1"></p>
                <p class="text-[9px] text-slate-600 -mt-1">RANK</p>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap mb-1">
                  <span class="text-[10px] text-slate-500 num" x-text="p.date + ' · ' + p.time"></span>
                  <span x-show="p.views >= 100000" class="text-[9px] font-bold uppercase tracking-wide bg-gradient-to-r from-amber-500/20 to-rose-500/20 text-amber-400 border border-amber-500/30 rounded-full px-2 py-0.5">🔥 Viral</span>
                  <span x-show="p.er >= 3" class="text-[9px] font-bold uppercase tracking-wide bg-emerald-500/15 text-emerald-400 border border-emerald-500/25 rounded-full px-2 py-0.5">💚 Resonans</span>
                  <a :href="p.url" target="_blank" class="text-[10px] text-sky-400 hover:text-sky-300 ml-auto">Buka di Threads ↗</a>
                </div>
                <p class="text-[13px] leading-relaxed text-slate-200 whitespace-pre-line" x-text="p.content || '(tiada teks)'"></p>

                <!-- metrics -->
                <div class="grid grid-cols-5 gap-2 mt-3 text-center">
                  <div><p class="text-sm font-bold text-emerald-400 num" x-text="fmtNum(p.views)"></p><p class="text-[9px] text-slate-500 uppercase">views</p></div>
                  <div><p class="text-sm font-bold num" x-text="fmtNum(p.likes)"></p><p class="text-[9px] text-slate-500 uppercase">likes</p></div>
                  <div><p class="text-sm font-bold text-rose-400 num" x-text="fmtNum(p.comments)"></p><p class="text-[9px] text-slate-500 uppercase">komen</p></div>
                  <div><p class="text-sm font-bold text-amber-400 num" x-text="fmtNum(p.shares)"></p><p class="text-[9px] text-slate-500 uppercase">share</p></div>
                  <div><p class="text-sm font-bold text-sky-400 num" x-text="p.er + '%'"></p><p class="text-[9px] text-slate-500 uppercase">ER</p></div>
                </div>

                <!-- expand comments -->
                <template x-if="p.topComments && p.topComments.length">
                  <div class="mt-3">
                    <button @click="expanded[p.id] = !expanded[p.id]" class="text-[11px] font-semibold text-slate-400 hover:text-emerald-400 transition inline-flex items-center gap-1">
                      <span x-text="expanded[p.id] ? '▾' : '▸'"></span> Lihat komen teratas (<span class="num" x-text="p.topComments.length"></span>)
                    </button>
                    <div x-show="expanded[p.id]" class="mt-2 space-y-2">
                      <template x-for="(c,ci) in p.topComments" :key="ci">
                        <div class="bg-slate-800/50 border border-slate-700/60 rounded-lg px-3 py-2">
                          <p class="text-[10px] font-semibold text-sky-400"><span x-text="'@' + c.name"></span> <span class="text-slate-600 font-normal" x-text="c.date"></span> <span class="text-slate-600" x-show="c.likes">· ♥ <span class="num" x-text="c.likes"></span></span></p>
                          <p class="text-[12px] text-slate-300 mt-0.5 whitespace-pre-line" x-text="c.message"></p>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </article>
        </template>
        <p x-show="!filteredPosts.length" class="text-center text-slate-500 text-sm py-8">Tiada post sepadan.</p>
      </div>

      <!-- KOMEN TAB -->
      <div x-show="tab==='komen'" class="space-y-3">
        <template x-for="(p,i) in commentedPosts" :key="p.id">
          <article class="card p-4 sm:p-5 fade-in" :style="'animation-delay:' + Math.min(i*40,300) + 'ms'">
            <div class="flex items-center gap-2 mb-2 flex-wrap">
              <span class="text-[10px] text-slate-500 num" x-text="p.date"></span>
              <span class="text-[10px] font-semibold text-rose-400 num" x-text="p.comments + ' komen'"></span>
              <a :href="p.url" target="_blank" class="text-[10px] text-sky-400 ml-auto hover:text-sky-300">Buka di Threads ↗</a>
            </div>
            <p class="text-[12px] text-slate-400 whitespace-pre-line mb-3" x-text="(p.content||'').slice(0,180) + ((p.content||'').length>180?'…':'')"></p>
            <div class="space-y-2" x-show="p.topComments.length">
              <template x-for="(c,ci) in p.topComments" :key="ci">
                <div class="bg-slate-800/50 border border-slate-700/60 rounded-lg px-3 py-2">
                  <p class="text-[10px] font-semibold text-sky-400"><span x-text="'@' + c.name"></span> <span class="text-slate-600 font-normal" x-text="c.date"></span> <span class="text-slate-600" x-show="c.likes">· ♥ <span class="num" x-text="c.likes"></span></span></p>
                  <p class="text-[12px] text-slate-300 mt-0.5 whitespace-pre-line" x-text="c.message"></p>
                </div>
              </template>
            </div>
            <p x-show="!p.topComments.length" class="text-[11px] text-slate-600 italic">Komen belum sync / tiada akses.</p>
          </article>
        </template>
        <p x-show="!commentedPosts.length" class="text-center text-slate-500 text-sm py-8">Belum ada komen yang sync.</p>
      </div>
    </section>

    <footer class="mt-10 text-center text-[10px] text-slate-600 leading-relaxed">
      <p>USTAZ BASRI · SUNNAH NEUROPARENTING — AI OS v2.0 · data: Zernio REST API · auto-refresh 15 min</p>
      <p class="mt-1">Dashboard dijana <span x-text="data.meta.generatedAt"></span> · sasaran 3M views 🎯</p>
    </footer>

<script>
function dashboard() {
  return {
    data: { meta:{generatedAt:null, account:{}}, totals:{}, posts:[], daily:[], followers:[], insights:[] },
    loading: false, error: null, q: '', sortKey: 'views', tab: 'posts',
    expanded: {},
    fw: 320, fh: 140,

    async init() {
      await this.load();
      setInterval(() => this.load(), 15 * 60 * 1000);   // auto-refresh 15 min
    },

    async load() {
      this.loading = true; this.error = null;
      try {
        const r = await fetch('data/data.json?t=' + Date.now());
        if (!r.ok) throw new Error('HTTP ' + r.status);
        this.data = await r.json();
        if (!this.data.meta) this.data.meta = {generatedAt:null, account:{}};
      } catch (e) {
        this.error = 'Gagal muat data: ' + e.message + ' — cuba refresh sebentar lagi.';
        console.error(e);
      } finally { this.loading = false; }
    },

    // ---- helpers ----
    fmtNum(n) {
      n = n || 0;
      if (n >= 1e6) return (n/1e6).toFixed(n>=10e6?0:2) + 'M';
      if (n >= 1e3) return (n/1e3).toFixed(n>=100e3?0:1) + 'K';
      return String(n);
    },
    get targetViews() { return this.data.meta.targetViews || 3000000; },
    get zernioViews() { return this.data.totals.views || 0; },
    get officialViews() { return (this.data.official||{}).totals ? this.data.official.totals.views : 0; },
    get officialLikes() { return (this.data.official||{}).totals ? this.data.official.totals.likes : 0; },
    get officialReplies() { return (this.data.official||{}).totals ? this.data.official.totals.replies : 0; },
    get officialReposts() { return (this.data.official||{}).totals ? this.data.official.totals.reposts : 0; },
    get officialFetched() { return (this.data.official||{}).fetchedAt || ''; },
    get totalViews() { return this.appViews || this.officialViews || this.zernioViews; },
    get targetReached() { return this.totalViews >= this.targetViews; },
    get totalLikes() { return this.data.totals.likes || 0; },
    get totalComments() { return this.data.totals.comments || 0; },
    get totalShares() { return this.data.totals.shares || 0; },
    get totalFollowers() { return this.data.meta.account.followers || 0; },
    get appViews() { return (this.data.meta.appReported||{}).views || 0; },
    get appViewers() { return (this.data.meta.appReported||{}).viewers || 0; },
    get appUpdated() { return (this.data.meta.appReported||{}).updated || '—'; },
    get followerGain() {
      const f = this.data.followers || [];
      return f.length ? f[f.length-1].count - f[0].count : 0;
    },
    get avgLikes() {
      const p = this.data.posts || [];
      return p.length ? Math.round(this.totalLikes / p.length) : 0;
    },
    get progressPct() {
      const t = this.targetViews; if (!t) return 0;
      return Math.round(this.totalViews / t * 100);
    },
    get viewsSubLabel() {
      const parts = [];
      if (this.appViews > 0) parts.push('app ' + this.appUpdated);
      if (this.officialViews > 0) parts.push('API auto: ' + this.fmtNum(this.officialViews));
      if (!parts.length) parts.push('Zernio: ' + this.fmtNum(this.zernioViews));
      return parts.join(' · ');
    },
    get remaining() { return Math.max(0, this.targetViews - this.totalViews); },
    get paceNote() {
      const d = this.data.daily || [];
      const last = d.slice(-7);
      if (!last.length) return '';
      const perDay = Math.round(last.reduce((s,x)=>s+x.views,0) / last.length);
      const days = Math.ceil(this.remaining / Math.max(perDay,1));
      return '~' + this.fmtNum(perDay) + '/hari → ' + days + ' hari';
    },
    get daily() { return this.data.daily || []; },
    get last14() { return this.daily.slice(-14); },
    get maxDaily() { return Math.max(1, ...this.last14.map(d=>d.views)); },
    barHeight(d) { return Math.max(2, Math.round(d.views / this.maxDaily * 100)); },
    barLabel(d) {
      const v = d.views;
      if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
      if (v >= 1e3) return (v/1e3).toFixed(0) + 'K';
      return v ? String(v) : '';
    },
    get followers() { return this.data.followers || []; },
    get followerPts() {
      const f = this.followers;
      if (f.length < 2) return [];
      const w = this.fw, h = this.fh, pad = 6;
      const min = f[0].count, max = Math.max(...f.map(x=>x.count), min+1);
      const range = max - min || 1;
      return f.map((x,i) => ({
        x: pad + i * (w - pad*2) / (f.length - 1),
        y: h - pad - (x.count - min) / range * (h - pad*2),
        date: x.date, count: x.count
      }));
    },
    get followerSvg() {
      const pts = this.followerPts;
      if (pts.length < 2) return '';
      const w = this.fw, h = this.fh;
      const line = pts.map(p => p.x + ',' + p.y).join(' ');
      const area = line + ' ' + pts[pts.length-1].x + ',' + h + ' ' + pts[0].x + ',' + h;
      const dots = pts.map(p =>
        '<circle cx="' + p.x + '" cy="' + p.y + '" r="3" fill="#020617" stroke="#34d399" stroke-width="2">' +
        '<title>' + p.date + ': ' + p.count + ' followers</title></circle>').join('');
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full h-36">' +
        '<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#34d399" stop-opacity=".35"/>' +
        '<stop offset="100%" stop-color="#34d399" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        '<polygon points="' + area + '" fill="url(#fg)"></polygon>' +
        '<polyline points="' + line + '" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>' +
        dots + '</svg>';
    },
    get insights() { return this.data.insights || []; },
    get posts() { return this.data.posts || []; },
    get filteredPosts() {
      let p = this.posts;
      if (this.q) {
        const s = this.q.toLowerCase();
        p = p.filter(x => (x.content||'').toLowerCase().includes(s));
      }
      const k = this.sortKey === 'date' ? 'date' : this.sortKey;
      return [...p].sort((a,b) => {
        if (k === 'date') return (b.date||'').localeCompare(a.date||'');
        return (b[k]||0) - (a[k]||0);
      });
    },
    get commentedPosts() {
      return [...this.posts].filter(p => p.comments > 0).sort((a,b)=>b.comments-a.comments);
    },
  };
}
</script>
